# tmux configuration (written for tmux 3.4, Ubuntu 24.04 apt)
# Reload with prefix + R

# change prefix to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# use fish (it is not the login shell, see kitty.conf), or bash if fish
# isn't installed
if-shell "command -v fish" "set-option -g default-shell /usr/bin/fish" "set-option -g default-shell /bin/bash"

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1 (instead of 0)
set -g pane-base-index 1

# keep window numbers without gaps when one is closed
set -g renumber-windows on

# colors: proper terminfo inside tmux, and 24-bit color from kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"
# undercurl (used for spelling/diagnostics in nvim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# no delay after Escape (otherwise switching modes in nvim/fish lags)
set -sg escape-time 10

# let nvim know when it gains/loses focus (autoread etc.)
set -g focus-events on

# longer scrollback
set -g history-limit 50000

# show messages a bit longer
set -g display-time 2000

# copy to the system clipboard via the terminal too (works over ssh in kitty)
set -g set-clipboard on

# mouse scroll and selection
set -g mouse on

# vim behaviour
set -g status-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# Escape clears the selection, or leaves copy mode if nothing is selected
bind-key -T copy-mode-vi Escape if -F "#{selection_present}" "send -X clear-selection" "send -X cancel"

# colon :
bind : command-prompt

# Forgot a key? Ctrl+a Space opens a menu with the common actions,
# Ctrl+a ? lists all keys (with descriptions for the ones below).
# With the mouse: click panes/windows, drag borders, right-click for menus.
bind -N "Menu with common actions" Space display-menu -T "#[align=centre] tmux " -x C -y C \
    "New pane beside"            i   "split-window -h -c '#{pane_current_path}'" \
    "New pane below"             n   "split-window -v -c '#{pane_current_path}'" \
    "New window"                 c   "new-window -c '#{pane_current_path}'" \
    "" \
    "Zoom pane (toggle)"         f   "resize-pane -Z" \
    "Close pane"                 q   "kill-pane" \
    "Resize mode (h/j/k/l)"      r   "switch-client -T resize" \
    "Next window"                Tab "next-window" \
    "Rename window"              ,   "command-prompt -I '#W' \"rename-window -- '%%'\"" \
    "" \
    "Scroll / search / copy"     [   "copy-mode" \
    "Pick session or window"     w   "choose-tree -Zs" \
    "Detach (keeps running)"     d   "detach-client" \
    "" \
    "List all keys"              ?   "list-keys -N" \
    "Reload config"              R   "source-file ~/.tmux.conf"

# reload this file
bind -N "Reload ~/.tmux.conf" R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Splits use the same letters as i3 (Alt+i / Alt+n) and nvim (Ctrl+w i / n):
# i = new pane beside, n = new pane below. | and - work too.
# New panes/windows open in the current directory.
bind -N "Split: new pane beside" i split-window -h -c "#{pane_current_path}"
bind -N "Split: new pane below" n split-window -v -c "#{pane_current_path}"
bind -N "Split: new pane beside" | split-window -h -c "#{pane_current_path}"
bind -N "Split: new pane below" - split-window -v -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

# Close and zoom also like i3 (Alt+q, Alt+f)
bind -N "Close pane" q kill-pane
bind -N "Zoom pane (toggle)" f resize-pane -Z
unbind '"'
unbind %

# moving between panes with vim movement keys
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# moving panes with shift + vim movement keys, like i3 (Alt+Shift+h/j/k/l)
bind -N "Move pane left" H swap-pane -t "{left-of}"
bind -N "Move pane down" J swap-pane -t "{down-of}"
bind -N "Move pane up" K swap-pane -t "{up-of}"
bind -N "Move pane right" L swap-pane -t "{right-of}"

# resize mode, like i3 (Alt+r): h/j/k/l repeatedly, Escape/Enter/q to leave
bind -N "Resize mode (h/j/k/l, Esc to leave)" r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 5 \; switch-client -T resize
bind -T resize Up resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# --- Look: Gruvbox Material Dark Hard (see docs/palette.md) --------------
# Named colors come from the terminal's palette (kitty.conf); the hex values
# are the backgrounds that aren't one of the 16 terminal colors.
set -g status-position bottom
set -g status-style "bg=#282828,fg=white"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=green,fg=black,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[bg=yellow fg=black bold] PREFIX #[default] ,}#{?#{==:#{client_key_table},resize},#[bg=red fg=black bold] RESIZE h/j/k/l  Esc #[default] ,}#[fg=brightblack]C-a Space: menu  #H "
set -g window-status-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[bg=#473c29,fg=yellow,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-separator ""
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=yellow"
set -g message-style "bg=#473c29,fg=white"
set -g message-command-style "bg=#473c29,fg=white"
set -g mode-style "bg=#504945,fg=brightwhite"
set -g clock-mode-colour yellow
