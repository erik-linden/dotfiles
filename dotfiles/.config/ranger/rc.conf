# ranger settings (only the changes from the defaults, which ranger loads first)
# All options: ranger --copy-config=rc, then look in ~/.config/ranger/rc.conf
# Key reference: docs/keybindings.md, or press ? inside ranger.
# Start with `rcd` in fish to stay in the last directory when quitting.

# Image previews in kitty (doesn't work inside tmux)
set preview_images true
set preview_images_method kitty

# Show git status of files
set vcs_aware true

# Borders between the columns
set draw_borders both

# Ask before deleting with dD
set confirm_on_delete always

# Hidden files: toggle with zh
set show_hidden false
