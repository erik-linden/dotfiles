; polybar configuration (written for polybar 3.7, Ubuntu 24.04 apt)
; Reference: https://github.com/polybar/polybar/wiki
; Started by launch.sh, which sets MONITOR and MODULES_RIGHT.
; Glyphs are from JetBrainsMono Nerd Font (Material Design icons, nf-md-*).

[colors]
; See docs/palette.md
bg_dim  = #141617
bg0     = #1d2021
bg1     = #282828
bg5     = #504945
focus   = #473c29
fg0     = #d4be98
grey    = #928374
red     = #ea6962
green   = #a9b665
yellow  = #d8a657
blue    = #7daea3
aqua    = #89b482

[settings]
screenchange-reload = true

[bar/main]
monitor = ${env:MONITOR:}
bottom = true
width = 100%
height = 22
background = ${colors.bg_dim}
foreground = ${colors.fg0}

; Same size as the i3 title bars; scales with Xft.dpi in ~/.Xresources
dpi = ${xrdb:Xft.dpi:96}
font-0 = JetBrainsMono Nerd Font:size=9;2

line-size = 2
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.bg5}

modules-left = i3
modules-right = ${env:MODULES_RIGHT:date}

cursor-click = pointer
enable-ipc = true
wm-restack = i3

; ---------------------------------------------------------------------------

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
; Show the whole name, with the windows i3wsr adds ("3 kitty | chrome")
strip-wsnumbers = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.bg0}

label-focused = %name%
label-focused-padding = 1
label-focused-background = ${colors.focus}
label-focused-underline = ${colors.yellow}

; Focused workspace on another monitor
label-visible = %name%
label-visible-padding = 1
label-visible-background = ${colors.bg1}
label-visible-underline = ${colors.bg5}

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-padding = 1
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg0}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
; click: disk usage browser
format-mounted = %{A1:qdirstat / &:}<label-mounted>%{A}
label-mounted = %{F#d8a657}󰋊%{F-} %free%
format-warn = <label-warn>
label-warn = %{F#ea6962}󰋊%{F-} %free%
warn-percentage = 90

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90
format = %{A1:kitty -e btop &:}<label>%{A}
label = %{F#d8a657}󰍛%{F-} %percentage_used:2%%
format-warn = %{A1:kitty -e btop &:}<label-warn>%{A}
label-warn = %{F#ea6962}󰍛%{F-} %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 95
format = %{A1:kitty -e btop &:}<label>%{A}
label = %{F#d8a657}󰻠%{F-} %percentage:2%%
format-warn = %{A1:kitty -e btop &:}<label-warn>%{A}
label-warn = %{F#ea6962}󰻠%{F-} %percentage:2%%

[module/pulseaudio]
type = internal/pulseaudio
; left click: mute, scroll: volume, right click: mixer
click-right = pavucontrol &
interval = 5
format-volume = <label-volume>
label-volume = %{F#d8a657}󰕾%{F-} %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.grey}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
label-connected = %{F#d8a657}󰖩%{F-} %essid%
format-disconnected =

[module/eth]
type = internal/network
interface-type = wired
interval = 5
format-connected = <label-connected>
label-connected = %{F#d8a657}󰈀%{F-} %local_ip%
format-disconnected =

[module/battery]
type = internal/battery
; ls /sys/class/power_supply/ to find the names
battery = BAT0
adapter = AC
full-at = 99
low-at = 20
poll-interval = 10
time-format = %H:%M

format-charging = <label-charging>
label-charging = %{F#a9b665}󰂄%{F-} %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%% %time%

format-full = <label-full>
label-full = %{F#a9b665}󰁹%{F-} full

format-low = <label-low>
label-low = %{F#ea6962}󰂃 %percentage%% %time%%{F-}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.yellow}

[module/date]
type = internal/date
interval = 1
; click to toggle between the short and long format
date = %Y-%m-%d
time = %H:%M:%S
date-alt = %A %d %B, week %V
time-alt = %H:%M
label = %{F#d8a657}󰥔%{F-} %date% %time%

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 70%
tray-background = ${colors.bg_dim}
