# pip user configuration
# Refuse to install packages outside of a virtual environment.
# Use uv/pixi for projects and `uv tool install` for command line tools.
# Override once with: PIP_REQUIRE_VIRTUALENV=0 pip install ...
#
# Machine specific settings (package index mirror etc.) belong in the
# system-wide config (`sudo pip config --global set ...`), not here. See
# docs/SETUP.md section 1.

[global]
require-virtualenv = true
