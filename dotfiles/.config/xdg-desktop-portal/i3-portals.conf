# Which backends xdg-desktop-portal uses in i3 (XDG_CURRENT_DESKTOP=i3).
# Without this file it uses none: the installed backends only declare
# themselves for GNOME. Then GTK4 apps (Nautilus...) can't read the dark
# mode setting (gsettings color-scheme) and start light; also file dialogs
# of apps that go through the portal. Same as GNOME's own
# /usr/share/xdg-desktop-portal/gnome-portals.conf, minus the gnome backend,
# which needs GNOME Shell.
# After changing: systemctl --user restart xdg-desktop-portal
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
