# Gruvbox Material colors (docs/palette.md) for Qt apps, used by qt5ct
# (~/.config/qt5ct/qt5ct.conf). One color per Qt palette role, in this order;
# #ff = fully opaque. Disabled text is grey0.
#
#    1 WindowText       fg0               #d4be98
#    2 Button           bg1               #282828
#    3 Light            bg5               #504945
#    4 Midlight         bg3               #3c3836
#    5 Dark             bg_dim            #141617
#    6 Mid              bg0               #1d2021
#    7 Text             fg0               #d4be98
#    8 BrightText       fg1               #ddc7a1
#    9 ButtonText       fg0               #d4be98
#   10 Base             bg0               #1d2021
#   11 Window           bg1               #282828
#   12 Shadow           bg_dim            #141617
#   13 Highlight        bg_visual_yellow  #473c29
#   14 HighlightedText  fg1               #ddc7a1
#   15 Link             blue              #7daea3
#   16 LinkVisited      purple            #d3869b
#   17 AlternateBase    bg1               #282828
#   18 NoRole           bg0               #1d2021
#   19 ToolTipBase      bg1               #282828
#   20 ToolTipText      fg0               #d4be98
#   21 PlaceholderText  grey1             #928374

