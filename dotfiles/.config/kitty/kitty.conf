# kitty configuration
# Reference: https://sw.kovidgoyal.net/kitty/conf/
# Reload a running kitty with ctrl+shift+F5.

# --- Shell ---------------------------------------------------------------
# fish is not the login shell (fish recommends against that, since programs
# expect a POSIX login shell), so the terminal starts it instead.
shell fish

# --- Font ----------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
# Show ligatures, except under the cursor (so you can see what you edit)
disable_ligatures cursor

# --- Cursor --------------------------------------------------------------
cursor_shape          block
cursor_blink_interval 0

# --- Scrollback ----------------------------------------------------------
scrollback_lines 100000
# ctrl+shift+h opens the whole scrollback in less (search with /)

# --- Mouse ---------------------------------------------------------------
url_style            curly
copy_on_select       no
strip_trailing_spaces smart

# --- Bell ----------------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

# --- Window --------------------------------------------------------------
# i3 manages windows, so no size memory. (Not hide_window_decorations: on
# X11 it only tells i3 to drop the window's border.)
remember_window_size    no
window_padding_width    2
confirm_os_window_close 0
# We use tmux for splits; keep kitty's own layouts simple
enabled_layouts splits,stack

# --- Misc ----------------------------------------------------------------
# Update check: kept at kitty's default (daily). Only kitty's own builds
# (installer, offline bundle) check, and a notification says when a new
# version is out; apt's build never checks, and without internet the check
# fails silently.
shell_integration     enabled
# Lets nvim and other tools set the clipboard via OSC 52 (useful in ssh/tmux)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# --- Keys ----------------------------------------------------------------
# Defaults: ctrl+shift+c/v copy/paste, ctrl+shift+equal/minus font size,
# ctrl+shift+backspace reset font size, ctrl+shift+h scrollback in pager,
# ctrl+shift+e open URL with hints, ctrl+shift+F2 edit config.
# Open a new kitty in the same directory (i3 tiles it)
map ctrl+shift+n launch --type=os-window --cwd=current
# Select a path/word/line on screen with hints and insert/copy it
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>shift+f kitten hints --type path
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>l kitten hints --type line --program -

