# picom compositor, so that windows with transparent parts (GTK menus,
# tooltips, popups with rounded corners) are drawn correctly; without a
# compositor those parts are black. No visual effects.
#
# This file is needed even though it only turns things off: without it,
# picom falls back to Ubuntu's /etc/xdg/picom.conf, which enables shadows
# and fading.
#
# Everything else is picom's default (no transparency, no dimming...).
# The rendering backend and vsync are chosen in i3/scripts/autostart.sh:
# GPU and tear-free on a real screen, CPU over a remote desktop.
#
# To try an effect, turn it on here and restart picom (`pkill picom; picom &`).
# Reference: man picom

shadow = false;
fading = false;
